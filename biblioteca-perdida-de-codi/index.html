<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Codi y la Biblioteca Perdida del Código</title>
    <style>
      :root {
        --hud-bg: rgba(13, 17, 23, 0.75);
        --hud-border: rgba(56, 189, 248, 0.25);
        --hud-accent-cyan: #38bdf8;
        --hud-accent-green: #10b981;
        --hud-accent-danger: #f87171;
        --hud-text: #e6edf3;
        --hud-font: system-ui, -apple-system, 'Inter', 'Fira Code', 'Segoe UI', sans-serif;
        --hud-font-mono: 'Fira Code', 'Courier New', monospace;
      }

      html, body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #070b19;
        height: 100%;
      }

      #app-canvas {
        display: block;
        width: 100vw;
        height: 100vh;
      }

      /* --- HUD / overlay: estética "Cyber-Glassmorphism" --- */

      .hud-overlay {
        font-family: var(--hud-font);
      }

      .hud-card {
        background: var(--hud-bg);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid var(--hud-border);
        border-radius: 12px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.45), 0 0 18px rgba(56, 189, 248, 0.08);
        color: var(--hud-text);
        font-family: var(--hud-font);
        padding: 10px 16px;
      }

      .hud-card--skills {
        min-width: 160px;
      }

      .hud-card--message {
        max-width: min(90vw, 480px);
        text-align: center;
        font-size: 14px;
      }

      .hud-card--controls {
        font-size: 13px;
        line-height: 1.7;
      }

      .hud-title {
        color: var(--hud-accent-cyan);
        font-weight: 600;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        margin-bottom: 8px;
        text-shadow: 0 0 8px rgba(56, 189, 248, 0.5);
      }

      .hud-skill-badge {
        display: inline-block;
        background: rgba(16, 185, 129, 0.12);
        border: 1px solid rgba(16, 185, 129, 0.5);
        color: var(--hud-accent-green);
        border-radius: 999px;
        padding: 2px 10px;
        margin: 2px 4px 2px 0;
        font-size: 12px;
        font-weight: 500;
        text-shadow: 0 0 6px rgba(16, 185, 129, 0.4);
      }

      .hud-skill-empty {
        color: rgba(230, 237, 243, 0.6);
        font-size: 13px;
        font-style: italic;
      }

      .hud-controls-list {
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .hud-controls-list li {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 6px;
      }

      .hud-controls-list li:last-child {
        margin-bottom: 0;
      }

      .hud-key-badge {
        display: inline-block;
        background: rgba(8, 15, 26, 0.85);
        border: 1px solid rgba(56, 189, 248, 0.45);
        border-radius: 6px;
        padding: 1px 7px;
        font-family: var(--hud-font-mono);
        font-size: 11px;
        color: var(--hud-accent-cyan);
        box-shadow: 0 0 6px rgba(56, 189, 248, 0.25);
      }

      .hud-control-accion {
        color: var(--hud-text);
      }
    </style>
  </head>
  <body>
    <canvas id="app-canvas"></canvas>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
